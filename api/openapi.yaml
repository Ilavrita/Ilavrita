# Ilavrita HTTP surface.
#
# This document describes the HTTP contract: routes, status codes and payload
# shapes. It is not a conformance claim. What Ilavrita supports as a FHIR server
# is declared at runtime by the CapabilityStatement at /fhir/R4/metadata, and
# that document — not this one — is what a FHIR client should trust.
#
# Every route here is implemented. Routes are added as behaviour ships, so that
# this file never describes something the server cannot do.
openapi: 3.1.0

info:
  title: Ilavrita
  summary: Open healthcare infrastructure. FHIR-native, self-hostable, edge to enterprise.
  description: |
    Ilavrita is an open-source FHIR R4 server.

    **This build implements the six single-resource interactions only** — create,
    read, vread, update, delete and instance history — and only for the resource
    types the CapabilityStatement at `GET /fhir/R4/metadata` declares. Search,
    Transactions, conditional operations and every other interaction answer
    `501 Not Implemented` as an `OperationOutcome`. See
    [known limitations](https://github.com/Ilavrita/Ilavrita/blob/dev/docs/known-limitations.md).

    **Authentication is not implemented.** Every FHIR interaction below answers
    `401` unless the deployment sets `ILAVRITA_DEV_PRINCIPAL`, which names one
    fixed identity with no credential behind it and is for development only.

    Do not store patient data in this build. It keeps no audit trail.
  version: 0.0.1
  license:
    name: AGPL-3.0-only
    identifier: AGPL-3.0-only
  contact:
    name: Ilavrita
    url: https://ilavrita.health
    email: oss@ilavrita.health

servers:
  - url: http://127.0.0.1:8090
    description: Local development

# No route declares a security scheme, because no credential is checked
# anywhere (FR-027). The FHIR interactions still refuse an unidentified caller
# with 401: a deployment names its one development principal through an
# environment variable, never through anything a request carries.
security: []

tags:
  - name: Operations
    description: |
      Health and build information. These live outside the FHIR namespace so that
      monitoring a deployment never depends on the healthcare API surface.
  - name: FHIR
    description: The FHIR R4 surface, rooted at `/fhir/R4`.

paths:
  /healthz:
    get:
      tags: [Operations]
      summary: Liveness
      description: Reports that the process is up and serving.
      operationId: getHealth
      responses:
        "200":
          description: The server is serving requests.
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/HealthReport"

  /version:
    get:
      tags: [Operations]
      summary: Build identity
      description: |
        Reports the running version and the commit it was built from. This is how
        a running instance is matched to a source tag and a release artefact.
      operationId: getVersion
      responses:
        "200":
          description: Build information.
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/VersionReport"

  /auth/claim:
    post:
      tags: [Auth]
      summary: Claim this install
      description: |
        Spends the install's one claim token and makes the first Super Admin.

        An install is created with no members, so every route that resolves
        standing has nobody to resolve. This is the one request that brings
        standing into being, and it is not first-signup-wins: whoever reaches
        the port first is not who owns the host. What proves they do is a token
        minted when the install was created and written to `claim-token` in the
        data directory, readable only by the user the server runs as.

        It creates the identity as well as the membership, because there is no
        other way to have one. Whether the claim can succeed is settled before
        anything is written: this is the only route an install serves before
        anybody can authenticate, and one that created an identity for every
        request would be a way to fill a database from outside.

        Every way this can fail answers the same `403`. A token that is wrong,
        one that expired and one already spent are the same fact to whoever
        holds the wrong one, and saying which would say whether this install has
        been claimed.
      operationId: claimInstall
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              required: [token, email, password]
              properties:
                token:
                  type: string
                  description: The token handed over in the data directory.
                email:
                  type: string
                password:
                  type: string
      responses:
        "201":
          description: The install is claimed and the first Super Admin exists.
          content:
            application/json:
              schema:
                type: object
                required: [project, identity, membership]
                properties:
                  project:
                    type: string
                  identity:
                    type: string
                  membership:
                    type: string
        "400":
          $ref: "#/components/responses/Invalid"
        "403":
          $ref: "#/components/responses/Forbidden"
        "500":
          $ref: "#/components/responses/InternalFailure"

  /auth/login:
    post:
      tags: [Authentication]
      summary: Log in
      description: |
        Proves a credential in one Project and issues a session. The token it
        returns appears here once and is never readable again: only its digest
        is stored.

        Every refusal answers the same way. A wrong password, an address nobody
        registered, a slug that resolves to nothing, an identity holding no
        standing, and a missing or wrong second-factor code are one answer, so
        nothing here can be used to find out which of them it was.

        `code` is carried with the password rather than asked for afterwards. A
        server that answered "now the code, please" would be saying the password
        was right, and would say it to anyone who guessed an address that exists.
      operationId: logIn
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/LoginRequest"
      responses:
        "200":
          $ref: "#/components/responses/SessionIssued"
        "400":
          $ref: "#/components/responses/Invalid"
        "401":
          $ref: "#/components/responses/Unauthenticated"
        "429":
          $ref: "#/components/responses/TooManyAttempts"
        "500":
          $ref: "#/components/responses/InternalFailure"

  /auth/logout:
    post:
      tags: [Authentication]
      summary: Log out
      description: |
        Destroys the session the request carries. The stored token digest is
        removed rather than labelled, so the token matches nothing afterwards.
      operationId: logOut
      responses:
        "204":
          description: The session is gone.
        "401":
          $ref: "#/components/responses/Unauthenticated"
        "500":
          $ref: "#/components/responses/InternalFailure"

  /auth/session:
    get:
      tags: [Authentication]
      summary: Describe the current session
      description: Reports who the token names, for a client that holds one.
      operationId: describeSession
      responses:
        "200":
          $ref: "#/components/responses/SessionDescribed"
        "401":
          $ref: "#/components/responses/Unauthenticated"
        "500":
          $ref: "#/components/responses/InternalFailure"

  /auth/mfa:
    post:
      tags: [Authentication]
      summary: Enrol a second factor
      description: |
        Begins a TOTP enrolment for the caller's own identity. The secret is
        returned once, here, and never again: what is stored afterwards is
        sealed, and what an authenticator app holds is the person's own.

        **Enrolling over a factor that is in force needs a current code from
        it.** Moving to a new phone and switching the factor off are the same
        request, and the code is what tells them apart — without it, a stolen
        session alone would be enough to disable the second factor, which is
        exactly what it exists to survive. A missing or wrong code answers
        `401`.

        The factor in force stays in force until the new one is proved at
        `/auth/mfa/activate`, so the move never leaves the account without one.

        Enrolling where nothing is in force needs no code: an unproved factor
        protects nobody, and asking for one would strand whoever's first
        attempt went wrong.

        There is no self-service way back from a lost phone while a factor is
        in force. That is deliberate — a self-service bypass would be the hole
        this rule closes. Somebody else with standing to administer the Project
        takes the factor off instead, through the control plane, which this
        description does not cover.

        `501` is the answer from a deployment that configured no sealing key.
        Storing the secret in the clear instead would make the database a list
        of everyone's second factor.
      operationId: enrolSecondFactor
      requestBody:
        required: false
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/FactorCode"
      responses:
        "201":
          $ref: "#/components/responses/FactorEnrolled"
        "400":
          $ref: "#/components/responses/Invalid"
        "401":
          $ref: "#/components/responses/Unauthenticated"
        "500":
          $ref: "#/components/responses/InternalFailure"
        "501":
          $ref: "#/components/responses/NotImplemented"
    delete:
      tags: [Authentication]
      summary: Withdraw a second factor
      description: |
        Removes the caller's factor. A current code is required to do it: a
        session is a bearer credential, so without one, stealing a session would
        be enough to take the second factor off the account it protects.

        A pending factor needs no code — the phone that would produce it may be
        exactly what was lost.
      operationId: withdrawSecondFactor
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/FactorCode"
      responses:
        "204":
          description: The factor is gone.
        "400":
          $ref: "#/components/responses/Invalid"
        "401":
          $ref: "#/components/responses/Unauthenticated"
        "404":
          $ref: "#/components/responses/NotFound"
        "500":
          $ref: "#/components/responses/InternalFailure"
        "501":
          $ref: "#/components/responses/NotImplemented"

  /auth/mfa/activate:
    post:
      tags: [Authentication]
      summary: Activate a second factor
      description: |
        Proves whatever is awaiting proof and puts it in force: a first
        enrolment, or a replacement begun at `/auth/mfa`. This is the only way
        a factor becomes required and the only way one is replaced — nothing
        can put a factor between a person and their account, or swap the phone
        that answers for it, except a code from that phone.

        `409` is the answer when nothing is awaiting proof.

        A code is accepted once. Presenting the same one again is refused, so a
        code watched over somebody's shoulder is not good for the rest of its
        thirty seconds.
      operationId: activateSecondFactor
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/FactorCode"
      responses:
        "200":
          $ref: "#/components/responses/FactorActivated"
        "400":
          $ref: "#/components/responses/Invalid"
        "401":
          $ref: "#/components/responses/Unauthenticated"
        "404":
          $ref: "#/components/responses/NotFound"
        "409":
          $ref: "#/components/responses/Conflict"
        "500":
          $ref: "#/components/responses/InternalFailure"
        "501":
          $ref: "#/components/responses/NotImplemented"

  /fhir/R4:
    post:
      tags: [FHIR]
      summary: Bundle transaction or batch
      description: |
        Performs every entry of a `transaction` Bundle as one act: all of them
        happen, or none does. An entry that fails rolls away every row, audit
        record and notification the entries before it wrote.

        Entries are performed in R4's order — deletes, then creates, then
        updates — but every identity is settled before any row is written, so an
        entry may reference one another entry creates whichever order the two
        were submitted in. A `urn:uuid:` fullUrl is the placeholder a reference
        names; one no entry claims is left as it was rather than rewritten to
        nothing.

        Every entry is decided on its own against the caller's grants, and every
        entry that wrote something is audited on its own. A Bundle is not a way
        to perform an interaction the caller could not have performed one at a
        time, nor a way to write without a trail.

        A `PUT` at an identity nothing holds creates it, which is what `update`
        does everywhere else here. An entry may state `ifNoneExist`, which is
        the conditional create, and a reference written `Patient?identifier=…`
        is resolved to the resource it identifies before anything is stored. The
        remaining per-entry preconditions are refused rather than ignored.

        A `batch` is submitted the same way and settles the opposite way: every
        entry stands or falls on its own, inside a savepoint, and the response
        describes each one including the ones that failed. It answers `200`
        whatever the entries did, because the request succeeded — which entry
        did not is the answer, not the status.
      operationId: performTransaction
      requestBody:
        required: true
        content:
          application/fhir+json:
            schema:
              $ref: "#/components/schemas/TransactionBundle"
      responses:
        "200":
          description: |
            Every entry was performed and the transaction committed. The answers
            are in the order the entries were submitted, not the order they ran.
          content:
            application/fhir+json:
              schema:
                $ref: "#/components/schemas/TransactionResponseBundle"
        "400":
          $ref: "#/components/responses/Invalid"
        "401":
          $ref: "#/components/responses/Unauthenticated"
        "403":
          $ref: "#/components/responses/Forbidden"
        "404":
          $ref: "#/components/responses/NotFound"
        "406":
          $ref: "#/components/responses/NotAcceptable"
        "409":
          $ref: "#/components/responses/Conflict"
        "413":
          $ref: "#/components/responses/TooLarge"
        "415":
          $ref: "#/components/responses/UnsupportedMediaType"
        "500":
          $ref: "#/components/responses/InternalFailure"

  /fhir/R4/metadata:
    get:
      tags: [FHIR]
      summary: CapabilityStatement
      description: |
        Declares what this server actually supports. The statement is generated
        from the table the FHIR routes are registered from, so it can name no
        interaction the router does not dispatch; a resource appears only once
        the matching interactions are implemented and covered by tests. It names
        no resource and touches no storage, so it is the one FHIR route
        reachable before a caller is identified.
      operationId: getCapabilityStatement
      responses:
        "200":
          description: The server's capability declaration.
          content:
            application/fhir+json:
              schema:
                $ref: "#/components/schemas/CapabilityStatement"
        "400":
          $ref: "#/components/responses/Invalid"
        "406":
          $ref: "#/components/responses/NotAcceptable"

  /fhir/R4/{resourceType}:
    parameters:
      - $ref: "#/components/parameters/ResourceType"
    put:
      tags: [FHIR]
      summary: Conditional update
      description: |
        Replaces the one resource the query matches. The query is the condition:
        `PUT /fhir/R4/Patient?identifier=…`.

        It is run under a grant for *searching* that type, not writing it.
        Naming a resource by a condition is reading it, so a caller who may
        write a type and not search it cannot address one this way.

        Nothing matching is a create, which is what `update` does everywhere
        else here. More than one match is `412`: the client asked about a
        resource and there are several, so nothing can be done that is what they
        meant. No query at all is `400`, because without one this would act on
        every resource of the type.
      operationId: updateConditionally
      requestBody:
        required: true
        content:
          application/fhir+json:
            schema:
              $ref: "#/components/schemas/Resource"
      responses:
        "200":
          $ref: "#/components/responses/ResourceRead"
        "201":
          $ref: "#/components/responses/ResourceCreated"
        "400":
          $ref: "#/components/responses/Invalid"
        "401":
          $ref: "#/components/responses/Unauthenticated"
        "403":
          $ref: "#/components/responses/Forbidden"
        "406":
          $ref: "#/components/responses/NotAcceptable"
        "412":
          $ref: "#/components/responses/PreconditionFailed"
        "413":
          $ref: "#/components/responses/TooLarge"
        "415":
          $ref: "#/components/responses/UnsupportedMediaType"
        "500":
          $ref: "#/components/responses/InternalFailure"
    delete:
      tags: [FHIR]
      summary: Conditional delete
      description: |
        Removes the one resource the query matches:
        `DELETE /fhir/R4/Patient?identifier=…`.

        Nothing matching is answered as done — the client wanted no resource
        matching, and there is none — so a retry after a successful delete is
        the ordinary case rather than an error. More than one match is `412`.

        `conditionalDelete` in the CapabilityStatement reads `single`, because a
        server that removed every match would be answering a different request.
      operationId: deleteConditionally
      responses:
        "204":
          description: |
            There is no resource matching that query, either because one was
            removed or because there was never one.
        "400":
          $ref: "#/components/responses/Invalid"
        "401":
          $ref: "#/components/responses/Unauthenticated"
        "403":
          $ref: "#/components/responses/Forbidden"
        "406":
          $ref: "#/components/responses/NotAcceptable"
        "412":
          $ref: "#/components/responses/PreconditionFailed"
        "500":
          $ref: "#/components/responses/InternalFailure"
    get:
      tags: [FHIR]
      summary: Search
      description: |
        Returns a `searchset` Bundle of the resources this caller may reach that
        match every parameter given. Values separated by commas are alternatives;
        repeating a parameter requires both.

        Which parameters a type answers is declared in its `CapabilityStatement`
        entry. A parameter this server does not implement is refused with `400`
        rather than ignored: a search that silently dropped one would return more
        than it was asked for, and the caller could not tell.

        `total` is present only when `_total=accurate` asked for it, and a `next`
        link only when a further page exists.
      operationId: searchResources
      parameters:
        - $ref: "#/components/parameters/SearchCount"
        - $ref: "#/components/parameters/SearchCursor"
        - $ref: "#/components/parameters/SearchTotal"
      responses:
        "200":
          $ref: "#/components/responses/SearchResults"
        "400":
          $ref: "#/components/responses/Invalid"
        "401":
          $ref: "#/components/responses/Unauthenticated"
        "403":
          $ref: "#/components/responses/Forbidden"
        "404":
          $ref: "#/components/responses/NotFound"
        "406":
          $ref: "#/components/responses/NotAcceptable"
        "500":
          $ref: "#/components/responses/InternalFailure"
    post:
      tags: [FHIR]
      summary: Create
      description: |
        Stores a new resource under a logical id this server assigns. A body
        carrying an `id` is refused: on this route the server mints them.

        The response always carries `ETag` and `Last-Modified` for the version
        written, and `Location` naming that version.

        `Binary` also accepts the document itself. Send it under its own media
        type — `application/pdf`, `image/png`, anything — and name what governs
        access to it in `X-Security-Context`, because a PDF has nowhere else to
        say it. A Binary naming nothing lands in no compartment and a confined
        caller cannot write it, which is the answer an unattributed document
        should get.

        However a Binary arrives, its bytes are kept outside the database and
        the row records what they are. A row carrying megabytes would make every
        read of the metadata pay for them and every backup carry them.
      operationId: createResource
      parameters:
        - $ref: "#/components/parameters/SecurityContext"
      requestBody:
        required: true
        content:
          application/fhir+json:
            schema:
              $ref: "#/components/schemas/Resource"
          application/octet-stream:
            schema:
              type: string
              format: binary
              description: A Binary's own bytes, under whatever media type they are.
      responses:
        "201":
          $ref: "#/components/responses/ResourceCreated"
        "400":
          $ref: "#/components/responses/Invalid"
        "401":
          $ref: "#/components/responses/Unauthenticated"
        "403":
          $ref: "#/components/responses/Forbidden"
        "404":
          $ref: "#/components/responses/NotFound"
        "406":
          $ref: "#/components/responses/NotAcceptable"
        "409":
          $ref: "#/components/responses/Conflict"
        "413":
          $ref: "#/components/responses/TooLarge"
        "415":
          $ref: "#/components/responses/UnsupportedMediaType"
        "500":
          $ref: "#/components/responses/InternalFailure"

  /fhir/R4/{resourceType}/$validate:
    parameters:
      - $ref: "#/components/parameters/ResourceType"
    post:
      tags: [FHIR]
      summary: Validate a resource without storing it
      description: |
        Answers what this server would make of a resource. Nothing is stored,
        and `200` is the answer whichever way it went: the operation was
        performed, and what it found is the `OperationOutcome`. A client reads
        the issues rather than the status, which is what lets one response carry
        a warning alongside a pass. Each issue names the element it is about in
        `expression`.

        Two sets of rules are applied. The ones that hold for every R4 resource
        whatever its own definition says — no null, no empty string, no empty
        array, an `id` that is the `id` datatype, a relative reference that names
        an R4 type and an id — and the ones that come from the type's own base
        definition, which this build embeds and seeds: elements nobody declared,
        required elements that are absent, repeating elements written as values,
        choices written twice or under a type they do not permit, and primitive
        syntax.

        What is not checked is a profile, a terminology binding, a FHIRPath
        invariant or whether a reference resolves. `"status": "banana"` passes.
        A resource that passes may still be clinically nonsensical.

        The same rules gate `POST` and `PUT`: a resource this refuses is one
        those routes refuse with `400`, carrying the same issues.

        It is authorized as a write of that type. Nothing is stored, but
        validating is what a client does before writing.
      operationId: validateResource
      requestBody:
        required: true
        content:
          application/fhir+json:
            schema:
              $ref: "#/components/schemas/Resource"
          application/json:
            schema:
              $ref: "#/components/schemas/Resource"
      responses:
        "200":
          description: What validation found, as an `OperationOutcome`.
          content:
            application/fhir+json:
              schema:
                $ref: "#/components/schemas/OperationOutcome"
        "400":
          $ref: "#/components/responses/Invalid"
        "401":
          $ref: "#/components/responses/Unauthenticated"
        "403":
          $ref: "#/components/responses/Forbidden"
        "404":
          $ref: "#/components/responses/NotFound"
        "413":
          $ref: "#/components/responses/TooLarge"
        "500":
          $ref: "#/components/responses/InternalFailure"

  /fhir/R4/{resourceType}/_search:
    parameters:
      - $ref: "#/components/parameters/ResourceType"
    post:
      tags: [FHIR]
      summary: Search (posted)
      description: |
        The same search as the type-level `GET`, with the parameters in a
        form-encoded body. R4 offers it so a query too long or too sensitive for
        a URL is not one a client has to shorten; the two resolve identically.

        Parameters given in the URL are read as well, so a client may split them.
        The body must be `application/x-www-form-urlencoded`: this is the one
        route that reads a form, and a resource submitted as one is refused.
      operationId: searchResourcesByPost
      requestBody:
        required: true
        content:
          application/x-www-form-urlencoded:
            schema:
              type: string
              description: The search parameters, encoded as a query string.
      responses:
        "200":
          $ref: "#/components/responses/SearchResults"
        "400":
          $ref: "#/components/responses/Invalid"
        "401":
          $ref: "#/components/responses/Unauthenticated"
        "403":
          $ref: "#/components/responses/Forbidden"
        "404":
          $ref: "#/components/responses/NotFound"
        "406":
          $ref: "#/components/responses/NotAcceptable"
        "415":
          $ref: "#/components/responses/UnsupportedMediaType"
        "500":
          $ref: "#/components/responses/InternalFailure"
    get:
      tags: [FHIR]
      summary: Search (wrong method)
      description: |
        `_search` is a reserved segment, not a logical id. Every method the
        instance route answers is refused here, so none of them reads it as one.
      operationId: getTypeSearch
      responses:
        "501":
          $ref: "#/components/responses/NotImplemented"
    put:
      tags: [FHIR]
      summary: Search (wrong method)
      description: The reserved segment is not a logical id, so an update to it is unimplemented.
      operationId: putTypeSearch
      responses:
        "501":
          $ref: "#/components/responses/NotImplemented"
    delete:
      tags: [FHIR]
      summary: Search (wrong method)
      description: The reserved segment is not a logical id, so a delete of it is unimplemented.
      operationId: deleteTypeSearch
      responses:
        "501":
          $ref: "#/components/responses/NotImplemented"

  /fhir/R4/_search:
    get:
      tags: [FHIR]
      summary: Whole-system search (not implemented)
      description: |
        Searching across every type is not implemented. The route exists so the
        reserved segment answers as an unimplemented interaction rather than
        being read as a resource type nobody declared.
      operationId: searchEverything
      responses:
        "501":
          $ref: "#/components/responses/NotImplemented"
    post:
      tags: [FHIR]
      summary: Whole-system search (not implemented)
      description: Searching across every type is not implemented.
      operationId: postSearchEverything
      responses:
        "501":
          $ref: "#/components/responses/NotImplemented"

  /fhir/R4/_history:
    get:
      tags: [FHIR]
      summary: Whole-system history (not implemented)
      description: |
        The history of every resource is not implemented. The route exists so the
        reserved segment answers as an unimplemented interaction rather than
        being read as a resource type nobody declared.
      operationId: getEverythingHistory
      responses:
        "501":
          $ref: "#/components/responses/NotImplemented"
    post:
      tags: [FHIR]
      summary: Whole-system history (not implemented)
      description: The history of every resource is not implemented.
      operationId: postEverythingHistory
      responses:
        "501":
          $ref: "#/components/responses/NotImplemented"

  /fhir/R4/{resourceType}/_history:
    parameters:
      - $ref: "#/components/parameters/ResourceType"
    get:
      tags: [FHIR]
      summary: Type history (not implemented)
      description: |
        Only instance-level history is implemented. This route exists so that the
        reserved `_history` segment is answered as an unimplemented interaction
        rather than read as a logical id. Every method the instance route answers
        is refused here, not only `GET`.
      operationId: getTypeHistory
      responses:
        "501":
          $ref: "#/components/responses/NotImplemented"
    put:
      tags: [FHIR]
      summary: Type history (not implemented)
      description: |
        The reserved segment is not a logical id, so an update addressed to it is
        unimplemented rather than a write to a resource called `_history`.
      operationId: putTypeHistory
      responses:
        "501":
          $ref: "#/components/responses/NotImplemented"
    delete:
      tags: [FHIR]
      summary: Type history (not implemented)
      description: |
        The reserved segment is not a logical id, so a delete addressed to it is
        unimplemented rather than a write to a resource called `_history`.
      operationId: deleteTypeHistory
      responses:
        "501":
          $ref: "#/components/responses/NotImplemented"

  /fhir/R4/{resourceType}/{id}:
    parameters:
      - $ref: "#/components/parameters/ResourceType"
      - $ref: "#/components/parameters/LogicalID"
    get:
      tags: [FHIR]
      summary: Read
      description: |
        Returns the current version, with `ETag` and `Last-Modified`.

        A resource that was deleted answers `410`; one that never existed, or
        that this caller's authorization cannot see, answers `404`. The two are
        deliberately indistinguishable for an out-of-scope resource, so an id
        cannot be probed for.

        Reading a `Binary` answers the document itself when the `Accept` names
        its media type, by name or by family, and the resource — with the bytes
        base64-encoded in `data` — otherwise. A wildcard answers the resource:
        this server answers JSON for `*/*` everywhere else, and a route that
        read a wildcard as "give me the document" would hand a browser a
        download where every other route hands it a resource. An `Accept`
        naming neither is `406`.
      operationId: readResource
      responses:
        "200":
          $ref: "#/components/responses/ResourceRead"
        "400":
          $ref: "#/components/responses/Invalid"
        "401":
          $ref: "#/components/responses/Unauthenticated"
        "403":
          $ref: "#/components/responses/Forbidden"
        "404":
          $ref: "#/components/responses/NotFound"
        "406":
          $ref: "#/components/responses/NotAcceptable"
        "410":
          $ref: "#/components/responses/Gone"
        "500":
          $ref: "#/components/responses/InternalFailure"
    put:
      tags: [FHIR]
      summary: Update
      description: |
        Replaces the resource, or creates it under the id the client named if it
        does not currently exist. `200` means an existing resource was replaced;
        `201` means one was brought into existence, and carries `Location`.

        `If-Match` carries one quoted version id, optionally weak, or `*`. A
        claim that disagrees with what the server observes is `412`, and nothing
        is written; so is any claim at all, `*` included, against an id that is
        absent or deleted, because there is no current representation to match
        (RFC 9110 13.1.1). An update carrying no `If-Match` names no version and
        replaces whatever the resource currently holds.
      operationId: updateResource
      parameters:
        - $ref: "#/components/parameters/IfMatch"
      requestBody:
        required: true
        content:
          application/fhir+json:
            schema:
              $ref: "#/components/schemas/Resource"
      responses:
        "200":
          $ref: "#/components/responses/ResourceRead"
        "201":
          $ref: "#/components/responses/ResourceCreated"
        "400":
          $ref: "#/components/responses/Invalid"
        "401":
          $ref: "#/components/responses/Unauthenticated"
        "403":
          $ref: "#/components/responses/Forbidden"
        "404":
          $ref: "#/components/responses/NotFound"
        "406":
          $ref: "#/components/responses/NotAcceptable"
        "409":
          $ref: "#/components/responses/Conflict"
        "412":
          $ref: "#/components/responses/PreconditionFailed"
        "413":
          $ref: "#/components/responses/TooLarge"
        "415":
          $ref: "#/components/responses/UnsupportedMediaType"
        "500":
          $ref: "#/components/responses/InternalFailure"
    delete:
      tags: [FHIR]
      summary: Delete
      description: |
        Makes the resource a tombstone. Reads of the id afterwards answer `410`,
        while its history stays readable. `If-Match` is honoured exactly as it is
        on update, `*` included.
      operationId: deleteResource
      parameters:
        - $ref: "#/components/parameters/IfMatch"
      responses:
        "204":
          description: The resource is deleted. No body.
        "400":
          $ref: "#/components/responses/Invalid"
        "401":
          $ref: "#/components/responses/Unauthenticated"
        "403":
          $ref: "#/components/responses/Forbidden"
        "404":
          $ref: "#/components/responses/NotFound"
        "406":
          $ref: "#/components/responses/NotAcceptable"
        "409":
          $ref: "#/components/responses/Conflict"
        "410":
          $ref: "#/components/responses/Gone"
        "412":
          $ref: "#/components/responses/PreconditionFailed"
        "500":
          $ref: "#/components/responses/InternalFailure"

  /fhir/R4/{resourceType}/{id}/_history:
    parameters:
      - $ref: "#/components/parameters/ResourceType"
      - $ref: "#/components/parameters/LogicalID"
    get:
      tags: [FHIR]
      summary: Instance history
      description: |
        Returns one page of the versions this caller may see, newest first, as a
        history `Bundle`. A resource whose history ends in a deletion still has a
        history, so this route answers `200` where a read of the same id answers
        `410`.

        20 versions by default and at most 200, with a `next` link when more
        follow. `_cursor` is a version this server handed back. A count outside
        that range, or a cursor that is not a version, is refused with `400`
        rather than rounded down: a caller who asked for a thousand and silently
        got two hundred cannot tell a short page from the end of the history.

        `total` is present only on a history that fits in one page. Counting a
        longer one would be a second query over the same rows, and a total that
        was guessed is worse than one that is absent.

        Which interaction produced a version is read from where it sits in the
        history, so only the page holding the oldest version marks an entry as
        the `POST` that created the resource.

        `_since`, `_at` and `_list` are not implemented and are ignored.
      operationId: getInstanceHistory
      parameters:
        - $ref: "#/components/parameters/SearchCount"
        - $ref: "#/components/parameters/SearchCursor"
      responses:
        "200":
          $ref: "#/components/responses/History"
        "400":
          $ref: "#/components/responses/Invalid"
        "401":
          $ref: "#/components/responses/Unauthenticated"
        "403":
          $ref: "#/components/responses/Forbidden"
        "404":
          $ref: "#/components/responses/NotFound"
        "406":
          $ref: "#/components/responses/NotAcceptable"
        "500":
          $ref: "#/components/responses/InternalFailure"

  /fhir/R4/{resourceType}/{id}/_history/{vid}:
    parameters:
      - $ref: "#/components/parameters/ResourceType"
      - $ref: "#/components/parameters/LogicalID"
      - name: vid
        in: path
        required: true
        description: |
          The version id, a decimal counter. Anything else names no stored
          version and answers `404`.
        schema:
          type: string
          pattern: "^[1-9][0-9]*$"
    get:
      tags: [FHIR]
      summary: Version read
      description: |
        Returns one immutable version. The `ETag` names the version asked for,
        never the resource's current one. Reading the version that recorded a
        deletion answers `410`.

        This route is authorized as history, not as read: a caller may be able to
        read a resource and not its history, or the reverse.
      operationId: readResourceVersion
      responses:
        "200":
          $ref: "#/components/responses/ResourceRead"
        "400":
          $ref: "#/components/responses/Invalid"
        "401":
          $ref: "#/components/responses/Unauthenticated"
        "403":
          $ref: "#/components/responses/Forbidden"
        "404":
          $ref: "#/components/responses/NotFound"
        "406":
          $ref: "#/components/responses/NotAcceptable"
        "410":
          $ref: "#/components/responses/Gone"
        "500":
          $ref: "#/components/responses/InternalFailure"

  /fhir/R4/{resourceType}/{id}/{operation}:
    parameters:
      - $ref: "#/components/parameters/ResourceType"
      - $ref: "#/components/parameters/LogicalID"
      - name: operation
        in: path
        required: true
        description: |
          Any segment beneath a resource that no route above matches, such as
          `$everything`. It stands in for every unmatched path under the FHIR
          base, at any depth.
        schema:
          type: string
        example: $everything
    get:
      tags: [FHIR]
      summary: Not implemented
      description: |
        Every FHIR interaction other than the six above is unimplemented.
        Failures are returned as `OperationOutcome` rather than as a framework
        error, so a client only ever parses FHIR-shaped responses.
      operationId: fhirNotImplemented
      responses:
        "501":
          $ref: "#/components/responses/NotImplemented"

components:
  parameters:
    ResourceType:
      name: resourceType
      in: path
      required: true
      description: |
        A FHIR resource type the CapabilityStatement declares. Any other name is
        not an endpoint here and answers `404`, before the caller is identified.
      schema:
        type: string
      example: Organization

    SecurityContext:
      name: X-Security-Context
      in: header
      required: false
      description: |
        What governs access to a raw `Binary` payload, as a `Type/id` reference.
        It becomes the resource's `securityContext`, which is what places it in
        a compartment. Only read when the body is the document itself; a Binary
        sent as a resource states it in the resource.
      schema:
        type: string
      example: Patient/pat-1

    SearchCount:
      name: _count
      in: query
      required: false
      description: |
        How many resources one page carries, between 1 and 200. An unbounded
        page would be one request that can read a Project.
      schema:
        type: integer
        minimum: 1
        maximum: 200
        default: 20

    SearchCursor:
      name: _cursor
      in: query
      required: false
      description: |
        Where a page resumes from. It is this server's own parameter rather than
        one R4 defines: a client follows the `next` link a Bundle carries and
        never builds it.
      schema:
        type: string

    SearchTotal:
      name: _total
      in: query
      required: false
      description: |
        Whether to count every match rather than only the page. `estimate` is
        refused: this build has no estimate to give, and answering with an
        accurate count would make the parameter a lie.
      schema:
        type: string
        enum: [none, accurate]
        default: none

    LogicalID:
      name: id
      in: path
      required: true
      description: The resource's logical id.
      schema:
        type: string
        pattern: "^[A-Za-z0-9.-]{1,64}$"
      example: 4a04d79cca99d1918e004dc216136018

    IfMatch:
      name: If-Match
      in: header
      required: false
      description: |
        One quoted version id, weak marker optional — `W/"2"` and `"2"` are read
        identically. `*` claims that the resource exists: it is satisfied by any
        live version and refused with `412` against an id that is absent or
        deleted, so it never creates. A list, or anything unquoted, is `400`.
      schema:
        type: string
      example: W/"2"

  headers:
    ETag:
      description: The version, always weak and always quoted.
      schema:
        type: string
      example: W/"2"

    LastModified:
      description: When the version was written, as an HTTP date.
      schema:
        type: string
      example: Tue, 16 Sep 2026 22:14:03 GMT

    Location:
      description: |
        The absolute URL of the version just written. Its origin is
        `ILAVRITA_BASE_URL` when a deployment sets one, and otherwise the
        request's own `Host`, which must be a host this deployment serves.
      schema:
        type: string
      example: http://127.0.0.1:8090/fhir/R4/Organization/4a04d79cca99d1918e004dc216136018/_history/1

    Authenticate:
      description: |
        The authentication scheme this server accepts. RFC 9110 15.5.2 requires
        it on every `401`. No credential is checked in this build, so no request
        can satisfy the challenge.
      schema:
        type: string
      example: Bearer realm="Ilavrita FHIR"

  schemas:
    HealthReport:
      type: object
      required: [status]
      properties:
        status:
          type: string
          const: ok
      examples:
        - status: ok

    VersionReport:
      type: object
      required: [version, revision, fhirVersion]
      properties:
        version:
          type: string
          description: Release version, or `dev` for an untagged build.
        revision:
          type: string
          description: Commit the binary was built from.
        fhirVersion:
          type: string
          description: FHIR release this server targets.
      examples:
        - version: 0.0.1
          revision: 4386b36ac1f4b0f0c5f7a1f0f6b2f4c1d8e9a0b1
          fhirVersion: 4.0.1

    Resource:
      type: object
      description: |
        A FHIR R4 resource. Its members are defined by the FHIR specification,
        not by this document, so no property list is given here.

        Three of them are this server's rather than the client's: `resourceType`
        must match the URL, `id` is assigned on create and must match the URL on
        update, and `meta.versionId` and `meta.lastUpdated` are dropped from
        whatever is submitted and written from the stored version on the way out.
        Every other member is stored and returned unchanged.
      required: [resourceType]
      additionalProperties: true
      properties:
        resourceType:
          type: string
          description: The resource type, which must match the URL.
      examples:
        - resourceType: Organization
          name: Ilavrita Clinic

    CapabilityStatement:
      type: object
      description: |
        A FHIR CapabilityStatement, narrowed to the fields Ilavrita populates. The
        full resource is defined by the FHIR specification.
      required: [resourceType, status, experimental, date, kind, fhirVersion, format, software, implementation, rest]
      properties:
        resourceType:
          type: string
          const: CapabilityStatement
        status:
          type: string
          enum: [draft, active, retired, unknown]
        experimental:
          type: boolean
          description: True while most of the FHIR surface is unimplemented.
        date:
          type: string
          format: date-time
          description: Required by R4. Fixed for the life of the process.
        implementation:
          type: object
          description: Required by R4 invariant cpb-2 when kind is "instance".
          required: [description]
          properties:
            description:
              type: string
            url:
              type: string
        kind:
          type: string
          enum: [instance, capability, requirements]
        fhirVersion:
          type: string
        format:
          type: array
          items:
            type: string
        software:
          type: object
          required: [name, version]
          properties:
            name:
              type: string
            version:
              type: string
        rest:
          type: array
          items:
            type: object
            required: [mode]
            properties:
              mode:
                type: string
                enum: [client, server]
              resource:
                type: array
                description: |
                  The types this build serves, from one closed list that both
                  gates the routes and fills this array: a type is listed exactly
                  when it is an endpoint, and one that is not listed answers
                  `404` on every route, before the caller is identified. A name
                  is added to that list only once it is a real R4 type and the
                  conformance suite exercises every interaction against it.
                items:
                  type: object
                  required: [type, versioning, updateCreate]
                  properties:
                    type:
                      type: string
                    interaction:
                      type: array
                      description: |
                        The codes the routes were registered under, in that
                        order. Every declared type carries the same set: one set
                        of generic handlers serves them all, so a per-type subset
                        would describe a dispatch that does not exist.
                      items:
                        type: object
                        required: [code]
                        properties:
                          code:
                            type: string
                            enum: [create, read, vread, update, delete, history-instance]
                    versioning:
                      type: string
                      description: Always `versioned`; every record carries a version.
                    updateCreate:
                      type: boolean
                      description: Always true; an update may create the id a client names.

    LoginRequest:
      type: object
      required: [project, email, password]
      properties:
        project:
          type: string
          description: The Project's slug.
        email:
          type: string
        password:
          type: string
        code:
          type: string
          description: |
            The second factor, when the identity has one. A client offers the
            field always and fills it when its user has a factor, which is
            something the person knows and the server never says.
          pattern: "^[0-9]{6}$"

    LoginResponse:
      type: object
      required: [token, expiresAt, project, membership]
      properties:
        token:
          type: string
          description: |
            The session token. It appears here once and is never readable
            again: only its digest is stored.
        expiresAt:
          type: string
        project:
          type: string
        membership:
          type: string

    SessionResponse:
      type: object
      required: [project, user, membership, expiresAt, admin, superAdmin]
      properties:
        project:
          type: string
        user:
          type: string
        membership:
          type: string
        expiresAt:
          type: string
        admin:
          type: boolean
        superAdmin:
          type: boolean

    FactorCode:
      type: object
      required: [code]
      properties:
        code:
          type: string
          pattern: "^[0-9]{6}$"

    FactorEnrolment:
      type: object
      required: [secret, uri]
      properties:
        secret:
          type: string
          description: |
            The shared secret, base32-encoded. This is the only moment it is
            readable: what is stored is sealed.
        uri:
          type: string
          description: The otpauth:// URL an authenticator app scans.

    FactorStatus:
      type: object
      required: [enrolled]
      properties:
        enrolled:
          type: boolean
        state:
          type: string
          enum: [pending, active]

    Bundle:
      type: object
      description: One resource's versions, newest first.
      required: [resourceType, type, total]
      properties:
        resourceType:
          type: string
          const: Bundle
        type:
          type: string
          const: history
        total:
          type: integer
          description: How many versions the Bundle carries.
        entry:
          type: array
          items:
            $ref: "#/components/schemas/BundleEntry"

    SearchBundle:
      type: object
      description: |
        One page of the resources a search matched. Every entry is a match:
        nothing is included alongside one, because `_include` is not implemented
        and an entry nobody asked for would be indistinguishable from one they
        did.
      required: [resourceType, type]
      properties:
        resourceType:
          type: string
          const: Bundle
        type:
          type: string
          const: searchset
        total:
          type: integer
          description: |
            How many resources match in total, across every page. Present only
            when `_total=accurate` asked for it: an absent total and a wrong one
            are very different promises.
        link:
          type: array
          description: |
            `self` is the search that produced this page. `next` is present only
            when a further page exists, because a link offered when nothing
            follows is a promise the next request breaks.
          items:
            type: object
            required: [relation, url]
            properties:
              relation:
                type: string
                enum: [self, next]
              url:
                type: string
        entry:
          type: array
          items:
            $ref: "#/components/schemas/SearchEntry"

    SearchEntry:
      type: object
      required: [fullUrl, resource, search]
      properties:
        fullUrl:
          type: string
          description: The absolute URL of the matched resource.
        resource:
          $ref: "#/components/schemas/Resource"
        search:
          type: object
          required: [mode]
          properties:
            mode:
              type: string
              const: match

    BundleEntry:
      type: object
      description: |
        One version. Nothing stores which interaction wrote a version, so
        `request.method` is derived: the oldest version of a resource is its
        create, a version that recorded a deletion is the delete, and every other
        version replaced the one before it.
      required: [fullUrl, request, response]
      properties:
        fullUrl:
          type: string
          description: The absolute URL of the resource this version belongs to.
        resource:
          $ref: "#/components/schemas/Resource"
        request:
          type: object
          required: [method, url]
          properties:
            method:
              type: string
              enum: [POST, PUT, DELETE]
            url:
              type: string
        response:
          type: object
          required: [status]
          properties:
            status:
              type: string
              description: The status the recorded interaction answered with.
            etag:
              type: string
            lastModified:
              type: string

    TransactionBundle:
      type: object
      description: |
        Several writes submitted as one act. At most 200 entries: one commit
        holds this process's single pooled connection for its whole length, so
        an unbounded Bundle is every other request waiting behind it.
      required: [resourceType, type, entry]
      properties:
        resourceType:
          type: string
          const: Bundle
        type:
          type: string
          enum: [transaction, batch]
        entry:
          type: array
          maxItems: 200
          items:
            $ref: "#/components/schemas/TransactionEntry"

    TransactionEntry:
      type: object
      required: [request]
      properties:
        fullUrl:
          type: string
          description: |
            What other entries in this Bundle call this one. A `urn:uuid:` value
            is a placeholder: references naming it are rewritten to the identity
            the entry settled on, before any entry is performed.
        resource:
          $ref: "#/components/schemas/Resource"
        request:
          type: object
          required: [method, url]
          properties:
            method:
              type: string
              enum: [POST, PUT, DELETE]
            url:
              type: string
              description: |
                `Type` for a create, `Type/id` for an update or a delete. A type
                this deployment does not serve is refused.

    TransactionResponseBundle:
      type: object
      description: |
        What each entry did, in the order the entries were submitted.
      required: [resourceType, type, entry]
      properties:
        resourceType:
          type: string
          const: Bundle
        type:
          type: string
          enum: [transaction-response, batch-response]
        entry:
          type: array
          items:
            $ref: "#/components/schemas/TransactionResponseEntry"

    TransactionResponseEntry:
      type: object
      description: |
        The resource itself is not returned: a transaction of two hundred
        entries would answer with two hundred resources the client already sent.
      required: [response]
      properties:
        fullUrl:
          type: string
          description: |
            Where the resource this entry wrote now lives. Absent for a delete,
            which leaves nothing to read.
        response:
          type: object
          required: [status]
          properties:
            status:
              type: string
              description: |
                `201 Created` for a create and for an update that created the id
                the client named, `200 OK` for an update that replaced one, and
                `204 No Content` for a delete.
            etag:
              type: string
            lastModified:
              type: string
            outcome:
              allOf:
                - $ref: "#/components/schemas/OperationOutcome"
              description: |
                Why this entry did not do what was asked. Present only in a
                batch response, and only for an entry that failed: a status
                alone names which entry went wrong and not what about it.

    OperationOutcome:
      type: object
      description: |
        The only error shape returned on FHIR routes. Runtime, database and
        framework errors are translated into this type, so internal detail never
        reaches a client.
      required: [resourceType, issue]
      properties:
        resourceType:
          type: string
          const: OperationOutcome
        issue:
          type: array
          minItems: 1
          items:
            $ref: "#/components/schemas/Issue"

    Issue:
      type: object
      required: [severity, code]
      properties:
        severity:
          type: string
          enum: [fatal, error, warning, information]
        code:
          type: string
          enum:
            [
              not-supported,
              not-found,
              invalid,
              security,
              conflict,
              exception,
              login,
              forbidden,
              deleted,
              duplicate,
              too-costly,
            ]
        diagnostics:
          type: string
          description: |
            Written for the API consumer. Never carries resource bodies, stack
            traces or internal identifiers.

  responses:
    ResourceRead:
      description: The resource, at the version the `ETag` names.
      headers:
        ETag:
          $ref: "#/components/headers/ETag"
        Last-Modified:
          $ref: "#/components/headers/LastModified"
      content:
        application/fhir+json:
          schema:
            $ref: "#/components/schemas/Resource"

    ResourceCreated:
      description: The resource as created, at its first version under this id.
      headers:
        ETag:
          $ref: "#/components/headers/ETag"
        Last-Modified:
          $ref: "#/components/headers/LastModified"
        Location:
          $ref: "#/components/headers/Location"
      content:
        application/fhir+json:
          schema:
            $ref: "#/components/schemas/Resource"

    SessionIssued:
      description: The credential was proved and a session issued.
      content:
        application/json:
          schema:
            $ref: "#/components/schemas/LoginResponse"

    SessionDescribed:
      description: Who the token names.
      content:
        application/json:
          schema:
            $ref: "#/components/schemas/SessionResponse"

    FactorEnrolled:
      description: The enrolment began. The secret is readable here and nowhere else.
      content:
        application/json:
          schema:
            $ref: "#/components/schemas/FactorEnrolment"

    FactorActivated:
      description: The factor was proved and is required from now on.
      content:
        application/json:
          schema:
            $ref: "#/components/schemas/FactorStatus"

    TooManyAttempts:
      description: |
        Too many attempts have been refused for this identity or from this
        address inside the window. It is counted across the install rather than
        within one process, so a deployment running several does not allow
        several times the guesses.
      content:
        application/fhir+json:
          schema:
            $ref: "#/components/schemas/OperationOutcome"

    SearchResults:
      description: One page of the resources the search matched.
      content:
        application/fhir+json:
          schema:
            $ref: "#/components/schemas/SearchBundle"

    History:
      description: The resource's versions, newest first.
      content:
        application/fhir+json:
          schema:
            $ref: "#/components/schemas/Bundle"

    Invalid:
      description: |
        The body is not a JSON FHIR resource, disagrees with the URL about the
        resource type or id, carries an id on create, or `If-Match` is malformed.
        It is also the answer when the request's `Host` is not one this
        deployment serves, because a published URL is never built from a host
        a client chose. Nothing was written.
      content:
        application/fhir+json:
          schema:
            $ref: "#/components/schemas/OperationOutcome"
          examples:
            invalid:
              value:
                resourceType: OperationOutcome
                issue:
                  - severity: error
                    code: invalid
                    diagnostics: The resource type in the body does not match the one in the URL.

    Unauthenticated:
      description: |
        Nothing identified the caller. Who is asking is prior to what they may
        do, so this is answered before any authorization decision is made.
      headers:
        WWW-Authenticate:
          $ref: "#/components/headers/Authenticate"
      content:
        application/fhir+json:
          schema:
            $ref: "#/components/schemas/OperationOutcome"
          examples:
            login:
              value:
                resourceType: OperationOutcome
                issue:
                  - severity: error
                    code: login
                    diagnostics: This request carries no authenticated principal.

    Forbidden:
      description: |
        The caller holds no authorization for this interaction on this resource
        type at all. It is never row-specific: a caller who may act on the type
        but not on one particular resource gets `404`, so this status cannot
        reveal that a resource exists.
      content:
        application/fhir+json:
          schema:
            $ref: "#/components/schemas/OperationOutcome"
          examples:
            forbidden:
              value:
                resourceType: OperationOutcome
                issue:
                  - severity: error
                    code: forbidden
                    diagnostics: This principal may not perform this interaction on this resource type.

    NotFound:
      description: |
        No such resource, or no such resource type. A resource this caller's
        authorization cannot see is reported identically to one that does not
        exist.
      content:
        application/fhir+json:
          schema:
            $ref: "#/components/schemas/OperationOutcome"
          examples:
            notFound:
              value:
                resourceType: OperationOutcome
                issue:
                  - severity: error
                    code: not-found
                    diagnostics: No such resource.

    NotAcceptable:
      description: The caller asked for a representation this server does not serve.
      content:
        application/fhir+json:
          schema:
            $ref: "#/components/schemas/OperationOutcome"
          examples:
            notAcceptable:
              value:
                resourceType: OperationOutcome
                issue:
                  - severity: error
                    code: not-supported
                    diagnostics: This server serves application/fhir+json only.

    UnsupportedMediaType:
      description: The request body was not sent as `application/fhir+json`.
      content:
        application/fhir+json:
          schema:
            $ref: "#/components/schemas/OperationOutcome"
          examples:
            unsupportedMediaType:
              value:
                resourceType: OperationOutcome
                issue:
                  - severity: error
                    code: not-supported
                    diagnostics: A request body must be sent as application/fhir+json.

    TooLarge:
      description: |
        The request body is larger than this server buffers. The request is well
        formed; only its size is refused, which is why it is not a `400`.
      content:
        application/fhir+json:
          schema:
            $ref: "#/components/schemas/OperationOutcome"
          examples:
            tooCostly:
              value:
                resourceType: OperationOutcome
                issue:
                  - severity: error
                    code: too-costly
                    diagnostics: The request body is larger than this server accepts.

    Conflict:
      description: |
        Another write reached the resource first, or a create named a logical id
        that is already taken.
      content:
        application/fhir+json:
          schema:
            $ref: "#/components/schemas/OperationOutcome"
          examples:
            conflict:
              value:
                resourceType: OperationOutcome
                issue:
                  - severity: error
                    code: conflict
                    diagnostics: Another write reached this resource first.

    PreconditionFailed:
      description: |
        `If-Match` was sent and disagrees with what the server observes — a
        different version, or a resource that is absent or deleted. Nothing was
        written.
      content:
        application/fhir+json:
          schema:
            $ref: "#/components/schemas/OperationOutcome"
          examples:
            preconditionFailed:
              value:
                resourceType: OperationOutcome
                issue:
                  - severity: error
                    code: conflict
                    diagnostics: The resource is not at the version If-Match claims.

    Gone:
      description: |
        The resource existed and was deleted. It is a distinct status from `404`
        on purpose, and a distinct issue code, so a client parsing only the body
        can still tell the two apart.
      content:
        application/fhir+json:
          schema:
            $ref: "#/components/schemas/OperationOutcome"
          examples:
            deleted:
              value:
                resourceType: OperationOutcome
                issue:
                  - severity: error
                    code: deleted
                    diagnostics: This resource has been deleted.

    InternalFailure:
      description: |
        The request could not be completed. The body is always this same generic
        outcome: an internal message can name a resource type, a logical id or a
        Project, and none of those may travel to a client.
      content:
        application/fhir+json:
          schema:
            $ref: "#/components/schemas/OperationOutcome"
          examples:
            exception:
              value:
                resourceType: OperationOutcome
                issue:
                  - severity: error
                    code: exception
                    diagnostics: This request could not be completed.

    NotImplemented:
      description: The interaction exists in FHIR but is not implemented here.
      content:
        application/fhir+json:
          schema:
            $ref: "#/components/schemas/OperationOutcome"
          examples:
            notImplemented:
              value:
                resourceType: OperationOutcome
                issue:
                  - severity: error
                    code: not-supported
                    diagnostics: This interaction is not implemented. See the CapabilityStatement at /fhir/R4/metadata.
