# Changelog generation. Deterministic: the same commits always produce the same
# changelog, which is what makes a release record trustworthy.
#
# Regenerate with `make changelog`.

[changelog]
header = """
# Changelog

All notable changes to Ilavrita are recorded here. This file is generated from
commit history by [git-cliff](https://git-cliff.org); edit commit messages, not
this file.

Versions follow [Semantic Versioning](https://semver.org/spec/v2.0.0.html). While
the major version is `0`, any release may change behaviour.

What Ilavrita does *not* yet do is tracked separately in
[docs/known-limitations.md](docs/known-limitations.md).

"""

body = """
{% if version %}\
## [{{ version | trim_start_matches(pat="v") }}](https://github.com/Ilavrita/Ilavrita/releases/tag/{{ version }}) - {{ timestamp | date(format="%Y-%m-%d") }}
{% else %}\
## Unreleased
{% endif %}\
{% for group, commits in commits | group_by(attribute="group") %}

### {{ group | striptags | trim | upper_first }}
{% for commit in commits %}
- {{ commit.message | upper_first }}{% if commit.breaking %} **(breaking)**{% endif %}\
{% endfor %}
{% endfor %}
"""

footer = """
<!-- generated by git-cliff -->
"""

trim = true

[git]
conventional_commits = true
filter_unconventional = true
protect_breaking_commits = true
split_commits = false
topo_order = false
sort_commits = "oldest"

# Every commit type is represented. Hiding routine work from a changelog makes
# the release look smaller than it was and hides supply-chain changes.
commit_parsers = [
  { message = "^feat", group = "<!-- 0 -->Features" },
  { message = "^fix", group = "<!-- 1 -->Fixes" },
  { message = "^perf", group = "<!-- 2 -->Performance" },
  { message = "^refactor", group = "<!-- 3 -->Refactoring" },
  { message = "^docs", group = "<!-- 4 -->Documentation" },
  { message = "^test", group = "<!-- 5 -->Testing" },
  { message = "^build", group = "<!-- 6 -->Build" },
  { message = "^ci", group = "<!-- 7 -->Continuous integration" },
  { message = "^chore\\(deps\\)", group = "<!-- 8 -->Dependencies" },
  { message = "^chore", group = "<!-- 9 -->Miscellaneous" },
]
