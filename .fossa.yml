# Scope for local FOSSA runs (`fossa analyze`).
#
# Pull request scanning is done by the FOSSA GitHub App, which reports into the
# project `git+github.com/Ilavrita/Ilavrita`. The CLI uses a different fetcher
# and would create a parallel `custom+` project for the same code, so no project
# identity is declared here and CI does not run the CLI.
#
# Only the two manifests Ilavrita ships are analysed. The vendored PocketBase
# fork carries its own go.mod and an admin-UI package.json; scanning those
# double-counts dependencies our go.mod already resolves through the replace
# directive, and adds upstream UI build tooling that never reaches a release.
version: 3

targets:
  only:
    - type: gomod
      path: ./
    - type: pnpm
      path: ./
