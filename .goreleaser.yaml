version: 2

project_name: ilavrita

before:
  hooks:
    # Fails the release early if the build ever stops using the Ilavrita fork.
    - ./scripts/verify-fork.sh

builds:
  - id: ilavrita
    main: ./apps/ilavrita
    binary: ilavrita
    # SQLite comes from a pure-Go driver, so cross-compilation needs no C toolchain.
    env:
      - CGO_ENABLED=0
    flags:
      - -trimpath
    ldflags:
      - -s -w
      - -X main.version={{ .Version }}
      - -X main.revision={{ .FullCommit }}
    goos: [linux, darwin, windows]
    goarch: [amd64, arm64]

archives:
  - id: ilavrita
    formats: [tar.gz]
    format_overrides:
      - goos: windows
        formats: [zip]
    files:
      - README.md
      - LICENSE
      - NOTICE
      - THIRD_PARTY_NOTICES.md
      - LICENSES/*

checksum:
  name_template: checksums.txt

sboms:
  - artifacts: archive

# Release notes come from git-cliff so that CHANGELOG.md and the GitHub
# release carry identical text from a single generator.
changelog:
  disable: true

release:
  draft: false
  prerelease: auto
