name: Pull request labels

on:
  pull_request_target:
    types: [opened, synchronize, reopened]

permissions:
  contents: read

jobs:
  area:
    name: Area
    runs-on: ubuntu-latest
    permissions:
      contents: read
      pull-requests: write
    steps:
      - uses: actions/labeler@v6
        with:
          configuration-path: .github/labeler.yml
          sync-labels: true

  size:
    name: Size
    runs-on: ubuntu-latest
    permissions:
      pull-requests: write
    steps:
      # Size is advisory. A large pull request is harder to review carefully,
      # which is worth saying out loud rather than enforcing.
      - uses: actions/github-script@v9
        with:
          script: |
            const sizes = [
              { label: 'size:XS', max: 10 },
              { label: 'size:S', max: 50 },
              { label: 'size:M', max: 200 },
              { label: 'size:L', max: 800 },
              { label: 'size:XL', max: Infinity },
            ];

            const { data: pr } = await github.rest.pulls.get({
              owner: context.repo.owner,
              repo: context.repo.repo,
              pull_number: context.issue.number,
            });

            const changed = pr.additions + pr.deletions;
            const chosen = sizes.find((size) => changed < size.max).label;

            const { data: current } = await github.rest.issues.listLabelsOnIssue({
              owner: context.repo.owner,
              repo: context.repo.repo,
              issue_number: context.issue.number,
            });

            for (const label of current.filter((l) => l.name.startsWith('size:'))) {
              if (label.name !== chosen) {
                await github.rest.issues.removeLabel({
                  owner: context.repo.owner,
                  repo: context.repo.repo,
                  issue_number: context.issue.number,
                  name: label.name,
                });
              }
            }

            await github.rest.issues.addLabels({
              owner: context.repo.owner,
              repo: context.repo.repo,
              issue_number: context.issue.number,
              labels: [chosen],
            });
