name: Release

on:
  push:
    tags: ["v*"]

permissions:
  contents: read

jobs:
  guard:
    name: Guard
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
        with:
          fetch-depth: 0

      # Releases are cut from main only. A tag pushed from dev or a feature
      # branch would otherwise publish unreviewed work under a version number.
      - name: Refuse a tag that is not on main
        run: |
          git fetch --quiet origin main
          if ! git merge-base --is-ancestor "$GITHUB_SHA" origin/main; then
            echo "::error::${GITHUB_REF_NAME} does not point at a commit on main; releases are cut from main only"
            exit 1
          fi
          echo "${GITHUB_REF_NAME} is on main"

  binaries:
    name: Binaries
    needs: guard
    runs-on: ubuntu-latest
    permissions:
      contents: write
    steps:
      - uses: actions/checkout@v7
        with:
          # GoReleaser derives release notes from history, so a shallow clone
          # would produce an empty changelog.
          fetch-depth: 0
          submodules: recursive

      - uses: actions/setup-go@v6
        with:
          go-version-file: go.mod
          cache: true

      - uses: anchore/sbom-action/download-syft@v0

      # CHANGELOG.md and the GitHub release body are generated from the same
      # commit history by the same tool, so the two can never disagree.
      - name: Generate release notes
        uses: orhun/git-cliff-action@v4
        with:
          config: cliff.toml
          args: --latest --strip all
        env:
          OUTPUT: RELEASE_NOTES.md

      - name: Append install notes
        run: |
          cat >> RELEASE_NOTES.md <<'NOTES'

          ## Container image

          ```bash
          docker pull ghcr.io/ilavrita/ilavrita:${{ github.ref_name }}
          ```

          Verify an archive against `checksums.txt` before running it.

          Ilavrita is licensed under AGPL-3.0 and includes PocketBase under the
          MIT licence. See `NOTICE` and `THIRD_PARTY_NOTICES.md` in the archive.
          NOTES

      - uses: goreleaser/goreleaser-action@v7
        with:
          version: "~> v2"
          args: release --clean --release-notes RELEASE_NOTES.md
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}

  container:
    name: Container
    needs: guard
    runs-on: ubuntu-latest
    permissions:
      contents: read
      packages: write
      id-token: write
      attestations: write
    steps:
      - uses: actions/checkout@v7
        with:
          submodules: recursive

      - uses: docker/setup-buildx-action@v4

      - uses: docker/login-action@v4
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      - id: meta
        uses: docker/metadata-action@v6
        with:
          images: ghcr.io/ilavrita/ilavrita
          tags: |
            type=semver,pattern={{version}}
            type=semver,pattern={{major}}.{{minor}}
            type=sha

      - id: push
        uses: docker/build-push-action@v7
        with:
          context: .
          file: build/docker/Dockerfile
          platforms: linux/amd64,linux/arm64
          push: true
          tags: ${{ steps.meta.outputs.tags }}
          labels: ${{ steps.meta.outputs.labels }}
          build-args: |
            VERSION=${{ github.ref_name }}
            REVISION=${{ github.sha }}
          cache-from: type=gha
          cache-to: type=gha,mode=max

      # Ties the published image back to the workflow run that produced it, so
      # the release artefact and its source can be checked against each other.
      - uses: actions/attest-build-provenance@v3
        with:
          subject-name: ghcr.io/ilavrita/ilavrita
          subject-digest: ${{ steps.push.outputs.digest }}
          push-to-registry: true

      - uses: sigstore/cosign-installer@v4

      # Signed by digest, never by tag: a tag can be moved to a different image,
      # and a signature that follows the tag would then vouch for something else.
      # Keyless, so there is no private key to store or rotate.
      - name: Sign the image
        run: cosign sign --yes "ghcr.io/ilavrita/ilavrita@${{ steps.push.outputs.digest }}"

      - uses: anchore/sbom-action@v0
        with:
          image: ghcr.io/ilavrita/ilavrita@${{ steps.push.outputs.digest }}
          format: spdx-json
          output-file: image-sbom.spdx.json
          upload-artifact: false

      # Says what is inside the image, attested to the same digest, so an
      # operator can answer "which version of this dependency did we ship?"
      # without trusting a rebuild.
      - uses: actions/attest-sbom@v3
        with:
          subject-name: ghcr.io/ilavrita/ilavrita
          subject-digest: ${{ steps.push.outputs.digest }}
          sbom-path: image-sbom.spdx.json
          push-to-registry: true

  packages:
    name: npm
    needs: guard
    runs-on: ubuntu-latest
    permissions:
      contents: read
      # GitHub Packages authenticates with the workflow's own token, so there is
      # no long-lived npm credential to store or rotate.
      packages: write
    steps:
      - uses: actions/checkout@v7

      - uses: pnpm/action-setup@v6

      - uses: actions/setup-node@v7
        with:
          node-version: 22
          cache: pnpm
          registry-url: https://npm.pkg.github.com
          scope: "@ilavrita"

      - run: pnpm install --frozen-lockfile

      - name: Take the version from the tag
        run: ./scripts/set-package-versions.sh "${{ github.ref_name }}"

      - run: pnpm --filter @ilavrita/sdk build

      # A prerelease must not become the default install for everyone, so it goes
      # out under the "next" tag instead of "latest".
      - name: Choose a dist-tag
        id: dist
        run: |
          if printf '%s' "${{ github.ref_name }}" | grep -q -- '-'; then
            echo "tag=next" >> "$GITHUB_OUTPUT"
          else
            echo "tag=latest" >> "$GITHUB_OUTPUT"
          fi

      # npm rather than pnpm: pnpm would leave the workspace: protocol for the
      # registry to choke on, and the version script above already resolved it.
      #
      # tsconfig goes first: sdk depends on it, and a published package whose
      # dependency does not resolve is broken from the moment it lands.
      - name: Publish
        run: |
          for package in packages/tsconfig packages/sdk-typescript; do
            ( cd "$package" && npm publish --tag "${{ steps.dist.outputs.tag }}" )
          done
        env:
          NODE_AUTH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
