version: 2
updates:
  - package-ecosystem: gomod
    directory: /
    schedule:
      interval: weekly
    commit-message:
      prefix: "chore(deps)"
    labels: ["type:dependencies"]
    groups:
      go-minor-and-patch:
        update-types: ["minor", "patch"]

  - package-ecosystem: npm
    directory: /
    schedule:
      interval: weekly
    commit-message:
      prefix: "chore(deps)"
    labels: ["type:dependencies"]
    groups:
      npm-minor-and-patch:
        update-types: ["minor", "patch"]

  - package-ecosystem: github-actions
    directory: /
    schedule:
      interval: weekly
    commit-message:
      prefix: "ci(deps)"
    labels: ["type:dependencies"]

  - package-ecosystem: docker
    directory: /build/docker
    schedule:
      interval: weekly
    commit-message:
      prefix: "chore(deps)"
    labels: ["type:dependencies"]
